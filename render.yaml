services:
  - type: web
    name: sdas-ml-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r backend_ml/requirements.txt
    startCommand: uvicorn backend_ml.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
